<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, follow">
    <title>48H Hydration Barrier Repair | Recommended Product</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #FAFAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #64748B;
            --amazon-button-bg: #FFD814;
            --amazon-button-hover: #F7CA00;
            --amazon-button-border: #FCD200;
            --cta-text-color: #0F1111;
            --accent-glow: rgba(255, 216, 20, 0.35);
            --radius-card: 24px;
            --radius-btn: 16px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 0.5rem;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        /* 
           MOBILE-FIRST GITHUB PAGES CONTAINER: 
           - Mobile: width: 95% (eliminates wasted white side borders)
           - Desktop: max-width: 450px for clean centered card
        */
        .container {
            width: 95%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 1.85rem 1.25rem 1.75rem 1.25rem;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 20px 40px -15px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(226, 232, 240, 0.8);
            margin: 0 auto;
        }

        /* Top Hook Title */
        .hook-title {
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: var(--text-primary);
            margin-bottom: 0.4rem;
            line-height: 1.22;
        }

        /* Product Sub-name */
        .product-sub {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        /* Responsive Product Image Wrapper */
        .image-wrapper {
            width: 100%;
            max-width: 290px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.75rem;
            padding: 0.5rem;
            background: #FFFFFF;
            border-radius: 16px;
        }

        .product-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Big Clickable Amazon CTA Button */
        .cta-button {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--amazon-button-bg);
            color: var(--cta-text-color);
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 700;
            padding: 1.15rem 1.25rem;
            border-radius: var(--radius-btn);
            border: 1px solid var(--amazon-button-border);
            box-shadow: 0 4px 14px var(--accent-glow);
            transition: all 0.2s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .cta-button:hover, .cta-button:active {
            background-color: var(--amazon-button-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .amazon-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Disclosure Footer */
        .disclosure {
            margin-top: 1.25rem;
            font-size: 0.75rem;
            color: #94A3B8;
            font-weight: 400;
        }

        @media (max-width: 380px) {
            .container {
                width: 98%;
                padding: 1.25rem 0.9rem;
            }
            .hook-title {
                font-size: 1.4rem;
            }
            .image-wrapper {
                height: 220px;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- 1. Top Hook Title -->
        <h1 class="hook-title">48H Hydration Barrier Repair</h1>
        <p class="product-sub">CeraVe Feuchtigkeitscreme 454g</p>

        <!-- 2. Clean Product Image (Direct URL) -->
        <div class="image-wrapper">
            <img src="https://m.media-amazon.com/images/I/61Nl-jD2wDL._AC_SL1500_.jpg" alt="CeraVe Feuchtigkeitscreme 454g" class="product-image" loading="eager">
        </div>

        <!-- 3. Big Clickable Amazon CTA Button -->
        <a href="https://amzn.to/example_cerave" target="_blank" rel="noopener sponsored" class="cta-button">
            <svg class="amazon-icon" viewBox="0 0 24 24">
                <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
            View on Amazon
        </a>

        <p class="disclosure">#Werbung • As an Amazon Associate I earn from qualifying purchases.</p>
    </main>

</body>
</html>
